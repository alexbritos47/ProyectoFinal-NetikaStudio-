<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Club Ciclista Maragato</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>

<!-- ===== LOADER ===== -->
<div id="loader">
  <div class="loader-wheel"></div>
  <h1>Club Ciclista Maragato</h1>
  <p>Cargando experiencia...</p>
</div>

<!-- ===== LOGIN ===== -->
<div class="login" id="loginBox">
  <input type="text" id="user" placeholder="Usuario"><br>
  <input type="password" id="pass" placeholder="Contraseña"><br>

  <input type="button" value="Ingresar" onclick="login()">
  <input type="button" value="Registrarse" onclick="register()">
</div>

<!-- ===== APP ===== -->
<div id="app" style="display:none; text-align:center;">
  <h1>Bienvenido</h1>
  <p id="welcome"></p>
  <button onclick="logout()">Cerrar sesión</button>
</div>







<script src="login.js"></script>
</body>
</html>
