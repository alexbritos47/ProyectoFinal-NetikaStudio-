services:
  api:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: maragato_api
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: margato_db
      DB_USER: maragato
      DB_PASSWORD: maragato123
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: maragato_web
    ports:
      - "3000:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  db:
    image: mysql:8.0
    container_name: maragato_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: margato_db
      MYSQL_USER: maragato
      MYSQL_PASSWORD: maragato123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Al crear la base por primera vez, ejecuta el schema automáticamente
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      # Datos iniciales (admin, categorías, socios de prueba). Corre después de schema.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data: