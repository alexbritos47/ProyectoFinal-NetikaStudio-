services:
  api:
    build: ./backend
    container_name: maragato_api
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: margato_db
      DB_USER: maragato
      DB_PASSWORD: maragato123
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: maragato_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: margato_db
      MYSQL_USER: maragato
      MYSQL_PASSWORD: maragato123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Al crear la base por primera vez, ejecuta el schema automáticamente
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data: