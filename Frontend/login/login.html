<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Club Ciclista Maragato</title>
  <link rel="stylesheet" href="login.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div id="loader">
  <div class="loader-wheel"></div>
  <h1>Club Ciclista Maragato</h1>
  <p>Cargando experiencia...</p>
</div>

<div class="body"></div>
<div class="background-inicial"></div>

<div class="header">
  <div>Club <span>Ciclista Maragato</span></div>
</div>

<div class="login" id="loginBox">
  <input type="text" id="user" placeholder="Usuario">
  <input type="password" id="pass" placeholder="Contraseña">
  <input type="button" value="Ingresar" onclick="login()">
  <input type="button" value="Registrarse" onclick="mostrarRegistro()">
</div>

<div class="register" id="registerBox" style="display:none;">
  <input type="text" id="nombre" placeholder="Nombre">
  <input type="text" id="apellido" placeholder="Apellido">
  <input type="text" id="cedula" placeholder="Cédula de identidad">
  <input type="email" id="email" placeholder="Email">
  <input type="text" id="regUser" placeholder="Usuario">
  <input type="password" id="regPass" placeholder="Contraseña">
  <input type="button" value="Crear cuenta" onclick="register()">
  <input type="button" value="Volver" onclick="mostrarLogin()">
</div>

<script src="login.js"></script>
</body>
</html>
