<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Perfil - Club Ciclista Maragato</title>

 <link rel="stylesheet" href="../cssglobal/global.css">
</head>

<body class="pagina-perfil">

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="logo">


            <div>
                <h1>Club Ciclista Maragato</h1>
                <p>Sistema de Gestión de Cuotas</p>
            </div>

        </div>


        <nav class="nav-buttons">

            <!-- VOLVER AL INICIO -->
            <button class="volver-inicio" onclick="window.location.href='../inicio/inicio.html'">
                
            </button>

        </nav>

    </header>


    <!-- =========================
         CONTENIDO
    ========================== -->

    <main class="contenedor">

        <section class="perfil-card">

            <!-- CABECERA DEL PERFIL -->

            <div class="perfil-header">

                <div class="avatar" id="avatar">
                    US
                </div>

                <div class="perfil-titulo">

                    <h2>Mi Perfil</h2>

                    <p>
                        Información personal del socio
                    </p>

                </div>

            </div>


            <div class="separador"></div>


            <!-- =========================
                 DATOS DEL USUARIO
            ========================== -->

            <div class="datos-grid">

                <div class="campo">

                    <label for="nombre">
                        Nombre
                    </label>

                    <div class="dato dato-fijo">
                        <span id="nombre">---</span>
                    </div>

                </div>


                <div class="campo">

                    <label for="apellido">
                        Apellido
                    </label>

                    <div class="dato dato-fijo">
                        <span id="apellido">---</span>
                    </div>

                </div>


                <div class="campo">

                    <label for="cedula">
                        Cédula de identidad
                    </label>

                    <div class="dato dato-fijo">
                        <span id="cedula">---</span>
                    </div>

                </div>


                <div class="campo">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <div class="dato">
                        <span id="email">---</span>
                    </div>

                </div>


                <div class="campo">

                    <label for="usuario">
                        Usuario
                    </label>

                    <div class="dato dato-fijo">
                        <span id="usuario">---</span>
                    </div>

                </div>


                <div class="campo">

                    <label for="numeroSocio">
                        Número de socio
                    </label>

                    <div class="dato dato-fijo">
                        <span id="numeroSocio">---</span>
                    </div>

                </div>

                <div class="campo">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <div class="dato">
                        <span id="telefono">---</span>
                    </div>

                </div>

                <div class="campo">

                    <label for="direccion">
                        Dirección
                    </label>

                    <div class="dato">
                        <span id="direccion">---</span>
                    </div>

                </div>

                <div class="campo">

                    <label for="categoria">
                        Categoría
                    </label>

                    <div class="dato dato-fijo">
                        <span id="categoria">---</span>
                    </div>

                </div>

                <div class="campo">

                    <label for="fechaIngreso">
                        Socio desde
                    </label>

                    <div class="dato dato-fijo">
                        <span id="fechaIngreso">---</span>
                    </div>

                </div>

            </div> <!-- fin de .datos-grid -->

            <!-- =========================
                 ACCIONES
            ========================== -->

            <div class="acciones">

                <button
                    id="editarPerfil"
                    class="btn-principal">

                    Editar información

                </button>

                <button
                    id="cerrarSesion"
                    class="btn-principal">

                    Cerrar sesión

                </button>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 Club Ciclista Maragato
        </p>

        <p>
            Sistema de Gestión de Cuotas
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/alertas.js"></script>
    <script src="../js/portal-api.js"></script>
    <script src="perfil.js"></script>

</body>
</html>
