<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin · Club Ciclista Maragato</title>
  <link rel="stylesheet" href="../../cssglobal/global.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="../../cssglobal/modo-oscuro.css">
  <script src="../../js/modo-oscuro.js"></script>
</head>
<body class="pagina-sociosadmin">

  <nav class="navbar-admin">
    <div class="marca-admin">
      <div class="logo-icon">CCM</div>
      <div>
        <h1>Club Ciclista Maragato</h1>
        <p>Panel de administración</p>
      </div>
    </div>
    <div class="nav-admin-links">
      <a href="sociosadmin.html" class="activo">Socios</a>
      <a href="Facturaadmin.html">Facturas</a>
      <a href="perfiladmin.html">Mi perfil</a>
    </div>
    <button class="btn-logout-admin" id="btnLogout">Cerrar sesión</button>
  </nav>

  <main>
    <div class="resumen-admin">
      <div class="tarjeta-admin">
        <div class="num" id="totalSocios">0</div>
        <div class="label">Socios totales</div>
      </div>
      <div class="tarjeta-admin">
        <div class="num" id="sociosAlDia">0</div>
        <div class="label">Cuotas al día</div>
      </div>
      <div class="tarjeta-admin alerta">
        <div class="num" id="sociosPendientes">0</div>
        <div class="label">Cuotas pendientes</div>
      </div>
    </div>

    <div class="toolbar-admin">
      <div class="buscador-admin">
        <input type="text" id="buscarSocio" placeholder="Buscar socio por nombre...">
      </div>
      <button class="btn-agregar-socio" id="btnAbrirModal">+ Agregar socio</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Socio</th>
          <th>Email</th>
          <th>Estado de cuota</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaSocios"></tbody>
    </table>
    <p class="vacio" id="mensajeVacio" style="display:none;">No se encontraron socios.</p>
  </main>

  <!-- Modal agregar socio -->
  <div class="modal-fondo" id="modalFondo">
    <div class="modal-caja">
      <h3>Agregar socio</h3>
      <div>
        <label for="nombreSocio">Nombre</label>
        <input type="text" id="nombreSocio" placeholder="Ej: Ana">
      </div>
      <div>
        <label for="apellidoSocio">Apellido</label>
        <input type="text" id="apellidoSocio" placeholder="Ej: Rodríguez">
      </div>
      <div class="fila-doble">
        <div>
          <label for="tipoDocSocio">Documento</label>
          <select id="tipoDocSocio">
            <option value="CI">CI</option>
            <option value="Pasaporte">Pasaporte</option>
          </select>
        </div>
        <div>
          <label for="nroDocSocio">Número</label>
          <input type="text" id="nroDocSocio" placeholder="Ej: 1.234.567-8">
        </div>
      </div>
      <div>
        <label for="emailSocio">Email (opcional)</label>
        <input type="text" id="emailSocio" placeholder="Ej: ana@correo.com">
      </div>
      
<!-- Campo para ingresar el teléfono o celular del socio -->
<div>
    <label for="telefonoSocio">Teléfono / celular (opcional)</label>
    <input
        type="tel"
        id="telefonoSocio"
        placeholder="Ej: 099 123 456"
        maxlength="30"
        autocomplete="tel"
    >
</div>

      <div>
        <label for="categoriaSocio">Categoría</label>
        <select id="categoriaSocio"></select>
      </div>
      <div class="fila-acceso">
        <input type="checkbox" id="crearAcceso">
        <label for="crearAcceso">Crear acceso al portal del socio</label>
      </div>
      <div class="bloque-acceso" id="bloqueAcceso">
        <div>
          <label for="usuarioSocio">Usuario</label>
          <input type="text" id="usuarioSocio" placeholder="Ej: ana.rodriguez" autocomplete="off">
        </div>
        <div>
          <label for="contrasenaSocio">Contraseña</label>
          <div class="perfil-clave">
            <input type="password" id="contrasenaSocio" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            <button type="button" class="btn-ojo" id="btnOjoNueva" aria-label="Mostrar contraseña">👁</button>
          </div>
        </div>
        <p class="ayuda-acceso">Con este usuario y contraseña el socio podrá entrar al portal.</p>
      </div>
      <div class="modal-botones">
        <button class="btn-cancelar" id="btnCancelarModal">Cancelar</button>
        <button class="btn-confirmar" id="btnConfirmarModal">Agregar</button>
      </div>
    </div>
  </div>

  <!-- Modal ficha del socio -->
  <div class="modal-fondo" id="modalPerfilFondo">
    <div class="modal-caja">
      <div class="perfil-head">
        <div class="perfil-avatar-grande" id="perfilAvatar"></div>
        <div>
          <h3 id="perfilNombre"></h3>
          <span class="estado-admin" id="perfilEstadoCuota"></span>
        </div>
      </div>
      <div class="perfil-datos" id="perfilDatos"></div>
      <div class="modal-botones">
        <button class="btn-cancelar" id="btnCerrarPerfil">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Toast de notificación -->
  <div class="toast-admin" id="toastAdmin">
    <div class="toast-icono">✓</div>
    <div class="toast-texto">
      <strong id="toastTitulo">Pago registrado</strong>
      <span id="toastDetalle"></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../../js/alertas.js"></script>
  <script src="sociosadmin.js"></script>
</body>
</html>
