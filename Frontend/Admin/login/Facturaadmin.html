<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facturas · Panel Admin · Club Ciclista Maragato</title>
  <link rel="stylesheet" href="../../cssglobal/global.css">
  <link rel="stylesheet" href="admin.css">
  <style>
    /* Barra para generar los recibos del año */
    .pagina-facturaadmin .barra-generar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 16px;
      font-size: 13px; color: var(--texto-suave);
    }
    .pagina-facturaadmin .barra-generar input {
      width: 90px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--c-300);
      background: rgba(144,202,249,.12); font-size: 14px; color: var(--texto);
    }
    .pagina-facturaadmin .btn-generar {
      border: none; background: var(--c-500); color: var(--c-100); padding: 9px 18px; border-radius: 999px;
      font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .pagina-facturaadmin .btn-generar:disabled { opacity: .6; cursor: default; }
  </style>
</head>
<body class="pagina-facturaadmin">

  <nav class="navbar-admin">
    <div class="marca-admin">
      <div class="logo-icon">CCM</div>
      <div>
        <h1>Club Ciclista Maragato</h1>
        <p>Panel de administración</p>
      </div>
    </div>
    <div class="nav-admin-links">
      <a href="sociosadmin.html">Socios</a>
      <a href="Facturaadmin.html" class="activo">Facturas</a>
      <a href="perfiladmin.html">Mi perfil</a>
    </div>
    <button class="btn-logout-admin" id="btnLogout">Cerrar sesión</button>
  </nav>

  <main>
    <div class="resumen">
      <div class="tarjeta pendiente">
        <div class="num" id="cantPendientes">0</div>
        <div class="label">Pendientes</div>
      </div>
      <div class="tarjeta paga">
        <div class="num" id="cantPagas">0</div>
        <div class="label">Pagas</div>
      </div>
      <div class="tarjeta impaga">
        <div class="num" id="cantImpagas">0</div>
        <div class="label">Impagas / vencidas</div>
      </div>
    </div>

    <div class="barra-generar">
      <span>Generar recibos del año</span>
      <input type="number" id="anioRecibos" min="2000" max="2100">
      <button class="btn-generar" id="btnGenerarRecibos">Generar recibos</button>
    </div>

    <div class="filtros">
      <div class="filtros-izq">
        <button class="activo" data-filtro="todas">Todas</button>
        <button data-filtro="pendiente">Pendientes</button>
        <button data-filtro="paga">Pagas</button>
        <button data-filtro="impaga">Impagas</button>
      </div>
      <div class="buscador-factura">
        <input type="text" id="buscarFactura" placeholder="Buscar por socio...">
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Socio</th>
          <th>N° factura</th>
          <th>Monto</th>
          <th>Vence</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tablaFacturas"></tbody>
    </table>
    <p class="vacio" id="mensajeVacioFacturas" style="display:none;">No hay facturas para este filtro.</p>
  </main>

  <div class="toast-admin" id="toastAdmin">
    <div class="toast-icono">✓</div>
    <div class="toast-texto">
      <strong id="toastTitulo">Pago registrado</strong>
      <span id="toastDetalle"></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../../js/alertas.js"></script>
  <script src="Facturaadmin.js"></script>
</body>
</html>
